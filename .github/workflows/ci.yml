name: CI

# Build + test on GitHub's runners on every push and PR.
# No PHI ever touches this pipeline — it runs against synthetic seed data only.
# This is the "build from GitHub" piece: your laptop is not involved.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # A throwaway Postgres for integration tests. Synthetic data only.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: oxford
          POSTGRES_PASSWORD: oxford
          POSTGRES_DB: oxford_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://oxford:oxford@localhost:5432/oxford_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # --- The steps below activate once application code exists. ---
      # Until apps/ and packages/ are scaffolded by Claude Code in Phase 0,
      # this workflow succeeds as a no-op so the pipeline is green from day one.

      - name: Detect project
        id: detect
        run: |
          if [ -f package.json ]; then
            echo "has_app=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_app=false" >> "$GITHUB_OUTPUT"
            echo "No application code yet (spec-only repo). CI is a no-op until Phase 0 scaffolds the monorepo."
          fi

      - name: Setup pnpm
        if: steps.detect.outputs.has_app == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        if: steps.detect.outputs.has_app == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        if: steps.detect.outputs.has_app == 'true'
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        if: steps.detect.outputs.has_app == 'true'
        run: pnpm -r typecheck

      - name: Lint
        if: steps.detect.outputs.has_app == 'true'
        run: pnpm -r lint

      - name: Module boundaries
        if: steps.detect.outputs.has_app == 'true'
        run: pnpm boundaries

      - name: Secret scan
        if: steps.detect.outputs.has_app == 'true'
        run: pnpm secret-scan

      - name: Unit + integration tests
        if: steps.detect.outputs.has_app == 'true'
        run: pnpm -r test

      - name: Build
        if: steps.detect.outputs.has_app == 'true'
        run: pnpm -r build
