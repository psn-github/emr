# Oxford HIS staging — nginx reverse proxy (ADR-0064).
#
# Install (one-time, on the VPS):
#   sudo cp deploy/nginx-oxford-his.conf /etc/nginx/sites-available/oxford-his
#   sudo ln -s /etc/nginx/sites-available/oxford-his /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# This is a SEPARATE site from the om-software config (oxmedkw.app) — it must
# never be merged into or overwrite that file (om-software is in daily clinical
# use). Use its own hostname (e.g. his-staging.<domain>) with its own TLS cert
# (certbot --nginx -d <hostname>).
#
# RESIDENCY (ADR-0007): staging / synthetic data only.

server {
    listen 80;
    server_name his-staging.example.com;  # CHANGE to the staging hostname

    # (certbot will add the TLS server block / redirect)

    # tRPC API + health probe → the oxford-his-api unit
    location /trpc/ {
        proxy_pass http://127.0.0.1:8060;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8060;
    }

    # UI shells (Phase 7.4/7.5) will serve static files here.
    location / {
        return 503 "Oxford HIS staging — API only (UI shells land in Phase 7.4/7.5)\n";
        add_header Content-Type text/plain;
    }
}
